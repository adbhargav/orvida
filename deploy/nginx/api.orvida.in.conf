# ORIVIDA API — nginx reverse proxy in front of the Node process.
#
#   sudo cp deploy/nginx/api.orvida.in.conf /etc/nginx/sites-available/api.orvida.in
#   sudo ln -s /etc/nginx/sites-available/api.orvida.in /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.orvida.in
#
# Run certbot AFTER the plain :80 server below is live — it needs to answer the
# ACME challenge over HTTP, and it rewrites this file to add the TLS block.

upstream orvida_api {
    server 127.0.0.1:5001;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.orvida.in;

    # certbot replaces this with a redirect to https once a certificate exists.
    location / {
        proxy_pass http://orvida_api;
        include /etc/nginx/proxy_params;

        # server.js sets `trust proxy`, so these decide what req.protocol and
        # req.ip report. Without them every generated asset URL comes out as
        # http:// and the storefront blocks it as mixed content.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # Delhivery rating and Razorpay calls happen inside the request.
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
        proxy_read_timeout    60s;
    }

    # Product and banner artwork is uploaded here; the default 1m would reject
    # a large photograph. The API itself caps JSON bodies at 1mb separately.
    client_max_body_size 12m;

    # Uploads are served out of Postgres and are immutable once written, so
    # nginx can hold them and spare the database the repeat reads.
    location /uploads/ {
        proxy_pass http://orvida_api;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # The webhook must reach the app with its bytes untouched — the Razorpay
    # signature is an HMAC over the exact payload.
    location /api/payments/webhook/razorpay {
        proxy_pass http://orvida_api;
        include /etc/nginx/proxy_params;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
    }

    gzip on;
    gzip_types application/json application/xml text/plain text/xml;
    gzip_min_length 512;

    # The API is not a website; nothing here should ever be framed or sniffed.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    access_log /var/log/nginx/orvida-api.access.log;
    error_log  /var/log/nginx/orvida-api.error.log;
}
